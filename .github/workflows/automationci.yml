name: Automation Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  automation-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium chromium-driver
          echo "CHROME_BIN=/usr/bin/chromium" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_PATH=/usr/bin/chromedriver" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          while IFS= read -r req; do
            echo "Installing dependencies from $req"
            python -m pip install -r "$req"
          done < <(find . -name requirements.txt -type f | sort)

      - name: Run all automation testcases
        run: |
          set -e
          export PYTHONPATH="$GITHUB_WORKSPACE"

          for project_dir in $(find . -type d \( -name 'AutomationFramework' -o -name 'Project1_Expand_Testing' \) | sort); do
            if [ -d "$project_dir/tests" ]; then
              echo "Running pytest for $project_dir"
              cd "$GITHUB_WORKSPACE/$project_dir"
              pytest -v tests
              cd "$GITHUB_WORKSPACE"
            fi
          done
