[pytest]
markers=
    smoke: Indicates a smoke test case
    sanity: Indicates a sanity test case
    regression: Indicates a regression test case
    api: Indicates an API test case

#pytest .ini file is used to configure pytest settings and options. 
#It allows you to customize the behavior of pytest, such as specifying markers, log levels, and other configurations.
#info is the default log level, you can change it to 
#DEBUG, WARNING, ERROR, or CRITICAL as per your requirement

#cli is the command line interface, this option enables logging to the console
#acttime is the date format for the log messages, you can change it as per your requirement

#| `print()`                        | Logger                                                   |
#| -------------------------------- | -------------------------------------------------------- |
#| Displays messages on the console | Can display messages and save them to files              |
#| No log levels                    | Supports `DEBUG`, `INFO`, `WARNING`, `ERROR`, `CRITICAL` |
#| No timestamps by default         | Can include timestamps automatically                     |
#| Mainly for quick debugging       | Best for real automation frameworks                      |

log_cli = true
log_cli_level = INFO
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_cli_format = %(asctime)s [%(levelname)s] (%(filename)s:%(lineno)s) %(message)s

log_file_level = INFO
log_file_date_format = %Y-%m-%d %H:%M:%S
log_file_format = %(asctime)s [%(levelname)s] (%(filename)s:%(lineno)s) %(message)s
log_file=logs/execution.log
